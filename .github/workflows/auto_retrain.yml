name: MLOps Continuous Learning Pipeline

on:
  schedule:
    # Run at 00:00 every Sunday (Weekly Auto-Retraining)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  retrain-models:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Pipeline & Retrain Neural Networks
      run: |
        python pretrain.py

    - name: Commit & Push New Model Weights
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add models/*.keras
        git add scalers/*.pkl
        git commit -m "Auto-retrain models with latest market data [skip ci]" || echo "No changes to commit"
        git push
